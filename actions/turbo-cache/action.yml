name: Turbo cache
description: Restore and save the local Turbo cache across runs.

inputs:
  key:
    description: >-
      Cache partition. Defaults to the job name, which is one string for every
      leg of a matrix — pass a distinct value per leg so one Node version cannot
      replay a result computed under another.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ inputs.key || github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.key || github.job }}-
