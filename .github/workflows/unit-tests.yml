name: Unit tests

# Reusable: the test suite on every Node × OS pair, with coverage uploaded to
# Codecov from one leg so the numbers are never averaged across platforms.
# Codecov is informational: vitest's per-file thresholds are the real gate, and
# an outage there must not turn a pull request red.
#
#   jobs:
#     test:
#       needs: [commitlint]
#       if: needs.commitlint.outputs.code-changed == 'true'
#       uses: rxova/shared/.github/workflows/unit-tests.yml@main
#       secrets:
#         CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON array of Node.js versions. The default is the `engines` major and current LTS.
        type: string
        required: false
        default: "[22, 24]"
      operating-systems:
        description: >-
          JSON array of runners. Path separators, line endings and the shell all differ on
          Windows, and only a Windows leg would notice.
        type: string
        required: false
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      test-command:
        description: The test run, coverage thresholds included.
        type: string
        required: false
        default: pnpm test
      coverage-node-version:
        description: The leg that uploads coverage, with `coverage-os`. Empty uploads nothing.
        type: string
        required: false
        default: "24"
      coverage-os:
        description: The runner of the leg that uploads coverage.
        type: string
        required: false
        default: ubuntu-latest
    secrets:
      CODECOV_TOKEN:
        description: The Codecov upload token.
        required: false

permissions:
  contents: read

jobs:
  test:
    name: unit (node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions) }}
        os: ${{ fromJSON(inputs.operating-systems) }}
    steps:
      - uses: actions/checkout@v7
      - uses: rxova/shared/actions/setup-pnpm@main
        with:
          node-version: ${{ matrix.node-version }}
      # Turbo hashes files and env, not the Node binary, and the cache action
      # keys on the job name — one string for every leg. Naming the partition
      # after the leg keeps one Node from replaying a result from another.
      - uses: rxova/shared/actions/turbo-cache@main
        with:
          key: unit-${{ matrix.os }}-node${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage thresholds
        run: ${{ inputs.test-command }}
      - name: Upload coverage
        if: matrix.os == inputs.coverage-os && format('{0}', matrix.node-version) == inputs.coverage-node-version
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
