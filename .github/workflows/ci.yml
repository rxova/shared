name: CI

# Public repositories get Actions minutes for free, so this workflow spends them
# on breadth: every job runs in parallel, tests run on two Node versions across
# three operating systems, and nothing is traded away to save time.

on:
  push:
    branches: [main]
  pull_request:
    # No `edited`: it fires on body edits too, and the title check lives in
    # pr-title.yml. `labeled`/`unlabeled` stay, because the changeset gate's
    # escape hatch is a label and adding one has to re-run the checks.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# One lane per ref. On main nothing is cancelled: the release commit that
# follows a merge skips the matrix because it trusts its parent's verdict, so
# that verdict has to be one that finished. Superseded pull request runs stay
# cancellable — the branch is judged again on its next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The root of the graph. It runs on push as well as pull_request on purpose:
  # a skipped job skips its dependents, so gating it on pull_request alone would
  # silently skip the whole workflow on main. The reusable workflows called here
  # by local path are the ones other rxova repositories call at @main, so every
  # change to them runs on this repository's pull request first.
  commitlint:
    name: commit messages
    uses: ./.github/workflows/commit-messages.yml
    with:
      # From source: this repository is where the bin is built.
      repo-config-command: node --import tsx ./packages/repo-config/src/cli/cli.ts

  checks:
    name: lint · format · types · build
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: ./.github/workflows/repo-checks.yml
    with:
      repo-config-command: node --import tsx ./packages/repo-config/src/cli/cli.ts

  test:
    name: unit
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: ./.github/workflows/unit-tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  supply-chain:
    name: audit · sherif · knip · dedupe
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: ./.github/workflows/supply-chain.yml

  pack-smoke:
    name: package contract
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: ./.github/workflows/package-contract.yml

  # The unit matrix runs the newest release of each Node major, which says little
  # about the oldest one `engines` promises; this installs each packed tarball on
  # exactly that floor. The workflow explains the rest.
  compat:
    name: packages on their oldest node
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: ./.github/workflows/node-floor-smoke.yml

  # The peer range says `react >=18`, and the lockfile installs 19. This pins the
  # oldest React at the root as well as in @rxova/ts-utils, and runs its suite
  # there. Through the action by local path rather than the reusable workflow,
  # which calls the action at @main: this way the pull request that changes the
  # action is the one that tests it. `react-minimum-smoke.yml` runs the workflow.
  react-minimum:
    name: ts-utils on react 18.2
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./actions/pin-react
        with:
          react-version: 18.2.0
          types-version: 18.3.27
          types-dom-version: 18.3.7
          filters: "@rxova/ts-utils"
      # The vitest config imports the built preset.
      - name: Build the presets
        run: pnpm exec turbo run build --filter=@rxova/repo-config
      - name: Test against React 18.2
        run: pnpm --filter @rxova/ts-utils exec vitest run --coverage.enabled=false
      - name: Typecheck against React 18 types
        run: pnpm --filter @rxova/ts-utils typecheck

  # Also on a documentation-only range that touched the site: its content is
  # what this build validates, links included.
  docs:
    name: docs build
    needs: [commitlint]
    if: >-
      needs.commitlint.outputs.code-changed == 'true' ||
      needs.commitlint.outputs.docs-changed == 'true'
    uses: ./.github/workflows/docs-build.yml

  # What a documentation-only range runs in place of `checks`: formatting. The
  # changeset gate below and `docs` above still run on their own terms.
  docs-checks:
    name: docs checks
    needs: [commitlint]
    if: needs.commitlint.outputs.docs-only == 'true'
    uses: ./.github/workflows/docs-checks.yml
    with:
      command: pnpm run prettier:check

  # Still runs and reports on a labelled pull request rather than being skipped
  # by an `if:`, so that honouring the label is visible in a log.
  changeset:
    name: changeset present
    needs: [commitlint]
    uses: ./.github/workflows/changeset-gate.yml
    with:
      repo-config-command: node --import tsx ./packages/repo-config/src/cli/cli.ts

  # The single context branch protection should require, and the only job here
  # that never skips. Matrix jobs skipped before expansion report under their
  # unexpanded name, and a `skipped` report never satisfies a required context,
  # so requiring the jobs one by one does not work. `skipped` is an answer this
  # workflow gives deliberately (a release commit, a documentation-only range,
  # a push with no pull request), so the gate accepts it; `cancelled` and
  # `failure` it does not.
  gate:
    name: all checks
    if: always()
    needs:
      - commitlint
      - checks
      - test
      - supply-chain
      - pack-smoke
      - compat
      - react-minimum
      - docs
      - docs-checks
      - changeset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only for the local action below.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: actions
      - uses: ./actions/require-jobs
        with:
          needs: ${{ toJSON(needs) }}
