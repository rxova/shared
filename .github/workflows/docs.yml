name: Docs

# Publishes apps/docs to GitHub Pages on every push to main. Pull requests are
# covered by CI's `docs build` job, which builds at the same base path.
#
# Skipped on the template repository itself, and quietly skipped (with a
# notice) until Pages is switched on: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/*/src/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Queued, never cancelled: this run is the publish, and cancelling one midway
# risks Pages keeping stale docs if the run that replaced it then fails.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # By local path, so a change to the reusable workflow runs here first.
  pages:
    name: Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-deploy.yml
