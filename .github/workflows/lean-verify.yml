name: Lean verify

# The old name of `verify.yml`'s lean shape (`fan-out: false`), kept for the
# repositories that already call it: same inputs, same outputs, the same one
# job. New repositories call `verify.yml`, which can also fan out.
#
#   jobs:
#     verify:
#       if: github.event.pull_request.draft != true
#       uses: rxova/shared/.github/workflows/lean-verify.yml@main
#
# Rule of thumb for outgrowing it: past about 10 packages, or once a warm run
# takes more than 10 minutes, call `verify.yml` with `fan-out: true`, which runs
# the steps as parallel jobs and needs a Turbo remote cache (the Vercel Remote
# Cache through the `TURBO_TOKEN` and `TURBO_TEAM` secrets, else the Actions
# cache fallback).
#
# It calls `verify.yml` by its full name: a nested `./` path would resolve in
# the caller's repository.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version.
        type: string
        required: false
        default: "24"
      timeout-minutes:
        description: The job's timeout.
        type: number
        required: false
        default: 15
      repo-config-command:
        description: How to run the rxova-repo-config bin.
        type: string
        required: false
        default: pnpm exec rxova-repo-config
      check-scope:
        description: "`false` skips `check-scope` and always reports `code-changed: true`, `docs-only: false`."
        type: boolean
        required: false
        default: true
      extra-command:
        description: Runs after verify.
        type: string
        required: false
        default: ""
    outputs:
      code-changed:
        description: "`true` unless the range is a release commit or documentation only."
        value: ${{ jobs.verify.outputs.code-changed }}
      docs-only:
        description: "`true` when the range changed documentation and nothing else but release bookkeeping."
        value: ${{ jobs.verify.outputs.docs-only }}
      docs-changed:
        description: "`true` when the range touched the docs site (`repoConfig.scope.site`), or cannot tell."
        value: ${{ jobs.verify.outputs.docs-changed }}

permissions:
  contents: read

jobs:
  verify:
    uses: rxova/shared/.github/workflows/verify.yml@main
    permissions:
      contents: read
    with:
      node-version: ${{ inputs.node-version }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
      repo-config-command: ${{ inputs.repo-config-command }}
      check-scope: ${{ inputs.check-scope }}
      extra-command: ${{ inputs.extra-command }}
      fan-out: false
    secrets: inherit
