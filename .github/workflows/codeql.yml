name: CodeQL

on:
  push:
    branches: [main]
  # Documentation holds nothing CodeQL analyses. `paths-ignore` is safe here
  # because no required check waits on this workflow (the ruleset requires
  # only CI's `all checks`); it skips a pull request whose every file matches.
  # Pushes to main still run, so the baseline never goes stale.
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
  schedule:
    - cron: "17 9 * * 6"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

# An analysis is a property of a commit, and only the newest commit on a ref can
# still be merged, so superseded runs are cancelled. Per ref, so two branches
# under review do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # By local path, so a change to the reusable workflow runs here first.
  analyze:
    name: Analyze
    uses: ./.github/workflows/codeql-analysis.yml
