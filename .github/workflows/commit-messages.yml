name: Commit messages

# Reusable: the root job of a CI graph. Lints the branch commits on a pull
# request or the pushed commit on a push, and decides with `check-scope` what
# the range touched. `code-changed` is false for a release commit (version and
# changelog only) and for a documentation-only range (what the caller's
# `repoConfig.scope` calls documentation: Markdown outside package internals by
# default); `docs-only` is true for the latter, and `docs-changed` when the docs
# site's sources moved. Every other job then gates on them:
#
#   jobs:
#     commitlint:
#       uses: rxova/shared/.github/workflows/commit-messages.yml@main
#     checks:
#       needs: [commitlint]
#       if: needs.commitlint.outputs.code-changed == 'true'
#     docs-site:
#       needs: [commitlint]
#       if: >-
#         needs.commitlint.outputs.code-changed == 'true' ||
#         needs.commitlint.outputs.docs-changed == 'true'
#     docs-checks:
#       needs: [commitlint]
#       if: needs.commitlint.outputs.docs-only == 'true'
#       uses: rxova/shared/.github/workflows/docs-checks.yml@main
#
# The gate is a job output rather than `paths-ignore`: a workflow that
# `paths-ignore` skips never reports, so a required check it feeds stays
# pending, while a skipped job passes `require-jobs`.
#
# Run it on push as well as pull_request: a skipped job skips its dependents,
# so gating it on pull_request alone would silently skip the whole graph on main.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version.
        type: string
        required: false
        default: "24"
      repo-config-command:
        description: >-
          How to run the rxova-repo-config bin. rxova/shared runs it from source;
          everyone else keeps the default.
        type: string
        required: false
        default: pnpm exec rxova-repo-config
      check-scope:
        description: "`false` skips `check-scope` and always reports `code-changed: true`, `docs-only: false`."
        type: boolean
        required: false
        default: true
    outputs:
      code-changed:
        description: "`true` unless the range is a release commit or documentation only."
        value: ${{ jobs.commitlint.outputs.code-changed }}
      docs-only:
        description: "`true` when the range changed documentation and nothing else but release bookkeeping."
        value: ${{ jobs.commitlint.outputs.docs-only }}
      docs-changed:
        description: "`true` when the range touched the docs site (`repoConfig.scope.site`), or cannot tell."
        value: ${{ jobs.commitlint.outputs.docs-changed }}

permissions:
  contents: read

jobs:
  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The fallbacks are the answers of a bin that predates an output, or of a
    # skipped `check-scope`: run everything, and nothing extra.
    outputs:
      code-changed: ${{ steps.scope.outputs.code-changed || 'true' }}
      docs-only: ${{ steps.scope.outputs.docs-only || 'false' }}
      docs-changed: ${{ steps.scope.outputs.docs-changed || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: rxova/shared/actions/setup-pnpm@main
        with:
          node-version: ${{ inputs.node-version }}
      - run: pnpm install --frozen-lockfile

      - name: Decide what this range touched
        id: scope
        if: inputs.check-scope
        env:
          BASE_SHA: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.sha || github.sha }}
        run: ${{ inputs.repo-config-command }} check-scope

      - name: Lint the branch commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --verbose --from "$BASE_SHA" --to "$HEAD_SHA"

      # On main this is the merged commit, already linted on its pull request,
      # plus the changesets `chore: version packages` commit. Cheap, and it is
      # what keeps this job unskippable.
      # Not on the push that creates the branch: a repository created from a
      # template starts with GitHub's own "Initial commit".
      - name: Lint the pushed commit
        if: github.event_name == 'push' && !github.event.created
        run: pnpm exec commitlint --last --verbose
