name: Lint PR title

# Reusable: lints the pull request title with the caller's commitlint config.
# The squash-merge subject is the PR title, and no commit in the branch contains
# it. Call it from a workflow triggered on
# `pull_request: { types: [opened, edited, reopened] }`:
#
#   jobs:
#     title:
#       uses: rxova/shared/.github/workflows/lint-pr-title.yml@main
#
# The caller needs `contents: read` and `pull-requests: read`.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to run commitlint on.
        type: string
        required: false
        default: '24'

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: commit message (PR title)
    # `changes.title` is only present when the edit touched the title, so a
    # body edit costs no runner at all.
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'edited' || github.event.changes.title)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: rxova/shared/actions/setup-pnpm@main
        with:
          node-version: ${{ inputs.node-version }}
      - run: pnpm install --frozen-lockfile

      # Read live from the API rather than out of `github.event`, so an
      # overlapping older run cannot affirm a title a newer edit has broken.
      # Piped, never interpolated — a PR title is attacker-controlled text.
      - name: Lint the PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title \
            | pnpm exec commitlint --verbose
